name: yocto-build

on:
  workflow_dispatch:
    inputs:
      image:
        description: "BitBake image target to build"
        required: false
        default: "fc-image"
  push:
    branches: [simba]
  pull_request:
    branches: [simba]

jobs:
  build:
    runs-on: self-hosted
    env:
      IMAGE: ${{ inputs.image || 'fc-image' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          recursive: true
          submodules: true
          branch: simba

      - name: Clean previous build images
        run: |
          rm -rf build/tmp/deploy/images/

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential chrpath cpio debianutils diffstat file gawk gcc git \
            iputils-ping libacl1 locales python3 python3-git python3-jinja2 \
            python3-pexpect python3-pip python3-subunit socat texinfo unzip \
            wget xz-utils zstd lz4 bc bison flex libssl-dev

      - name: Ensure en_US.UTF-8 locale
        run: |
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: Cache downloads and sstate
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: ${{ runner.os }}-yocto-${{ hashFiles('build/conf/*.conf', 'meta-myboard/**', 'meta-yocto-bsp/**', 'meta/**') }}
          restore-keys: |
            ${{ runner.os }}-yocto-

      - name: Build kernel and image
        shell: bash
        run: |
          set -eo pipefail
          set --
          export BBSERVER=""
          source oe-init-build-env build
          bitbake -c cleansstate virtual/kernel
          bitbake virtual/kernel
          bitbake "${IMAGE}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images
          path: build/tmp/deploy/images/
